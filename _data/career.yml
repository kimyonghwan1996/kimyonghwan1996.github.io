- id: nh-product-es-pipeline
  type: work
  company: 애자일소다
  client: NH농협은행
  project: 통합챗봇 지식기반 검색 파이프라인
  period: 2026.09 ~ 진행중
  role:
  - Data Engineer
  - RAG Engineer
  stack:
  - Elasticsearch
  - Kibana
  - Airflow
  - Kubernetes(ECK)
  - Python
  - Docker Compose
  - PyMuPDF
  summary: 상품 명세 DDL 기반 챗봇 검색 인덱스·적재 파이프라인 구축
  achievements:
  - 7개 상품군 DDL → ES 인덱스 매핑 설계
  - Airflow(KubernetesExecutor) 기반 상품 데이터 적재 배치 설계
  - 설명요약·예상질문 메타데이터 필드로 RAG 검색 확장 구조 설계
  - 검색 평가셋 22문항 구축, BM25·벡터·하이브리드 Hit@5 비교 자동화
  - HTML 추출 파이프라인 구축, 표 37개 변환·52청크 적재, 누출 0건
  - HTML 문서 검색·답변 평가셋 27문항 구축, 정답률 26/27
  - 좌표형 HTML 표 밖 텍스트를 좌표 기반 복구, 106줄 복구 손실 0건
  - bge-m3 벡터 양자화 비교 평가, bbq 적용으로 정확도 손실 없이 메모리 1/7 절감
  - 다단 머리글 등 복잡 표 문장 변환 규칙 구현, 원본 대조 검수 104/104 통과
  - 요약·예상질문 벡터 추가한 하이브리드 검색 적용, 바꿔말한 질문 검색 16/20→18/20
  - HTML 문서 파서를 RAG 플랫폼 커스텀 파서 규격으로 개편, 328건 무오류 처리
  - 표 구조 보존 청커 구축(행 단위 분할·머리글 반복), HTML 234건 → 15,458청크, 크기 초과 0건
  - 사내 문서 HTML 전처리 파서 구축, 본문 누락 단어 374개 → 0개
  - 벡터 PDF 업무흐름도를 도형·글자 좌표로 노드·간선 그래프화, 7건 원본 일치·Mermaid 산출
  troubleshooting:
  - problem: 표 열 이름이 '----'로 오적재(7청크)
    fix: PDF 파서의 구분선 오인 확인, 구분선 행 제거 후 재적재
    result: 오류 청크 7 → 0, 표 질의 벡터 MRR 0.85 → 0.92
  - problem: 그림 설명 생성 시 없는 내용을 지어냄
    fix: 작은 이미지 제외, 로컬 VLM(Qwen2.5-VL-7B)으로 설명 재생성
    result: 그림 28개 제목·축·글자 추출 개선
  - problem: 표 바로 앞 소제목 누락으로 당기·전기 수치 답변 역전
    fix: 표 앞 짧은 소제목을 표 이름표에 부착
    result: 해당 문항 정답 처리
  - problem: 여러 열에 병합된 합계 숫자가 첫 열에 배치되어 값 의미 변경
    fix: 숫자 병합값은 마지막 열에 배치, 단일값 행은 예외 처리
    result: 의도치 않은 변경 54개 표 → 2개 표
  - problem: 대형 표 분할 시 청크 크기 초과(최대 2,932자)
    fix: 긴 머리글 반복 중단, 각주는 별도 청크로 분리
    result: 초과 청크 183개 → 0개
  - problem: 조각난 연결선과 선 중간의 갈래선이 간선으로 미인식
    fix: 끝점 거리(36pt) 기반 조각 잇기, 점-선분 거리로 선 묶기, 화살촉 도형 분리
    result: 흐름도 7건 모두 원본 일치
